<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone 16 • Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap');
        
        body { font-family: "SF Pro Display", system-ui, sans-serif; }
        
        .iphone-frame {
            width: 380px;
            max-width: 100%;
            margin: 20px auto;
            background: #111;
            border-radius: 68px;
            padding: 14px;
            box-shadow: 0 0 0 14px #111, 0 0 0 16px #222, 0 30px 60px -15px rgba(0,0,0,0.6);
        }
        
        .iphone-screen {
            width: 100%;
            height: 760px;
            background: #000;
            border-radius: 54px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
        }
        
        .dynamic-island {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 34px;
            background: #000;
            border-radius: 9999px;
            z-index: 50;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
        }
        
        .status-bar { z-index: 40; }
        
        .app-icon {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-icon:active { transform: scale(0.85); }
        
        .modal {
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { transform: translate(-50%, -50%) scale(0.7); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center p-4">
    <div class="iphone-frame">
        <div class="iphone-screen" id="iphone-screen">
            
            <!-- Dynamic Island -->
            <div class="dynamic-island flex items-center justify-center">
                <div class="w-9 h-3 bg-zinc-900 rounded-full"></div>
            </div>
            
            <!-- Status Bar -->
            <div class="status-bar absolute top-0 left-0 right-0 h-12 flex items-center justify-between px-6 text-white text-sm font-medium z-40">
                <div id="status-time">9:41</div>
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-signal"></i>
                    <i class="fa-solid fa-wifi"></i>
                    <span id="battery-level">98%</span>
                </div>
            </div>

            <!-- LOCK SCREEN -->
            <div id="lock-screen" class="absolute inset-0 bg-cover bg-center flex flex-col justify-between pb-10 transition-all duration-700"
                 style="background-image: url('https://picsum.photos/id/1015/800/1700')">
                <div class="pt-16 text-center text-white">
                    <div id="lock-time" class="text-8xl font-light">9:41</div>
                    <div id="lock-date" class="text-xl mt-1">Thursday, May 7</div>
                </div>
                <div class="px-8 space-y-6">
                    <div onclick="unlockPhone()" class="bg-white/20 backdrop-blur-2xl py-4 rounded-3xl text-center font-medium cursor-pointer active:scale-95">
                        Swipe up to unlock
                    </div>
                    <div onclick="showFaceID()" class="text-center text-white/70">
                        <i class="fa-solid fa-face-smile text-5xl"></i>
                    </div>
                </div>
            </div>

            <!-- HOME SCREEN -->
            <div id="home-screen" class="hidden absolute inset-0 flex flex-col bg-gradient-to-br from-indigo-950 via-purple-950 to-black overflow-hidden">
                <!-- Widgets + Apps -->
                <div class="flex-1 overflow-x-auto snap-x snap-mandatory flex" id="home-pages">
                    <!-- Page 1 -->
                    <div class="w-full flex-shrink-0 p-6 snap-center">
                        <!-- Widget -->
                        <div class="bg-white/10 backdrop-blur-3xl rounded-3xl p-4 mb-8">
                            <div class="text-white text-sm">Weather</div>
                            <div class="flex justify-between items-center">
                                <div class="text-6xl">☀️</div>
                                <div class="text-right">
                                    <div class="text-5xl font-light">68°</div>
                                    <div class="text-sm">Sunny • New York</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-4 gap-5" id="app-grid-1"></div>
                    </div>
                    
                    <!-- Page 2 -->
                    <div class="w-full flex-shrink-0 p-6 snap-center">
                        <div class="grid grid-cols-4 gap-5" id="app-grid-2"></div>
                    </div>
                </div>

                <!-- Dock -->
                <div class="dock mx-auto mb-8 bg-white/15 backdrop-blur-3xl rounded-3xl px-6 py-3 flex gap-6 shadow-2xl">
                    <div onclick="openApp('phone')" class="text-4xl">📞</div>
                    <div onclick="openApp('messages')" class="text-4xl">💬</div>
                    <div onclick="openApp('safari')" class="text-4xl">🌐</div>
                    <div onclick="openApp('camera')" class="text-4xl">📷</div>
                </div>
            </div>

            <!-- APPS CONTAINERS -->
            <!-- Camera -->
            <div id="camera-app" class="hidden absolute inset-0 bg-black flex flex-col">
                <div class="p-4 text-white flex justify-between">
                    <button onclick="closeCurrentApp()" class="font-medium">Close</button>
                    <div>Camera</div>
                </div>
                <video id="camera-feed" class="flex-1 object-cover" autoplay playsinline></video>
                <div class="p-6 flex justify-center gap-12 text-white">
                    <button onclick="switchCamera()" class="text-3xl"><i class="fa-solid fa-rotate"></i></button>
                    <button onclick="takePhoto()" class="w-20 h-20 border-4 border-white rounded-full flex items-center justify-center active:scale-95">
                        <div class="w-16 h-16 bg-white rounded-full"></div>
                    </button>
                    <button onclick="closeCurrentApp()" class="text-3xl"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messages-app" class="hidden absolute inset-0 bg-zinc-950 text-white flex flex-col">
                <div class="p-4 border-b border-white/10 flex items-center gap-3">
                    <button onclick="closeCurrentApp()" class="text-xl">←</button>
                    <div class="font-semibold">Messages</div>
                </div>
                <div class="flex-1 p-4 space-y-6 overflow-auto" id="chat-window">
                    <div class="bg-blue-600 text-white p-3 rounded-2xl rounded-tl-none max-w-[75%] ml-auto">Hey, how are you?</div>
                    <div class="bg-zinc-800 p-3 rounded-2xl rounded-tr-none max-w-[75%]">I'm doing great! You?</div>
                </div>
                <div class="p-4 border-t border-white/10">
                    <input type="text" id="chat-input" placeholder="iMessage" 
                           class="w-full bg-zinc-800 rounded-3xl py-4 px-6 outline-none">
                </div>
            </div>

            <!-- Music -->
            <div id="music-app" class="hidden absolute inset-0 bg-gradient-to-br from-purple-900 to-black text-white flex flex-col">
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                    <div class="w-64 h-64 bg-gradient-to-br from-pink-500 to-purple-600 rounded-3xl mb-10 flex items-center justify-center text-8xl shadow-2xl">🎵</div>
                    <div class="font-medium text-xl">Blinding Lights</div>
                    <div class="text-zinc-400">The Weeknd</div>
                    <div class="w-full mt-12">
                        <input type="range" class="w-full accent-white" value="45">
                    </div>
                </div>
                <div class="p-6 flex justify-around text-4xl">
                    <i class="fa-solid fa-backward"></i>
                    <i onclick="togglePlay()" id="play-btn" class="fa-solid fa-pause-circle text-6xl"></i>
                    <i class="fa-solid fa-forward"></i>
                </div>
            </div>

            <!-- Other apps can be added similarly -->

            <!-- Control Center -->
            <div id="control-center" class="hidden absolute inset-0 bg-black/70 backdrop-blur-3xl pt-12 transition-all">
                <div class="max-w-md mx-auto grid grid-cols-2 gap-4 p-6">
                    <div class="bg-white/10 rounded-3xl p-6 text-center">Wi-Fi</div>
                    <div class="bg-white/10 rounded-3xl p-6 text-center">Bluetooth</div>
                    <div class="bg-white/10 rounded-3xl p-6 text-center">Airplane Mode</div>
                    <div class="bg-white/10 rounded-3xl p-6 text-center">Focus</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentApp = null;
        let photos = [];
        let cameraStream = null;
        let facingMode = "user";

        const defaultApps = [
            {name:"Camera", emoji:"📷", color:"#666", open: openCamera},
            {name:"Photos", emoji:"🖼️", color:"#f97316", open: openPhotos},
            {name:"Messages", emoji:"💬", color:"#22c55e", open: openMessages},
            {name:"Phone", emoji:"📞", color:"#22c55e", open: () => alert("📞 Calling... (Demo)")},
            {name:"Safari", emoji:"🌐", color:"#3b82f6", open: openSafari},
            {name:"Music", emoji:"🎵", color:"#a855f7", open: openMusic},
            {name:"Calendar", emoji:"📅", color:"#ef4444", open: () => alert("📅 Calendar opened")},
            {name:"Notes", emoji:"📝", color:"#eab308", open: () => alert("📝 Notes opened")},
            {name:"Settings", emoji:"⚙️", color:"#64748b", open: openSettings},
        ];

        function init() {
            renderHomeScreen();
            updateClock();
            setInterval(updateClock, 30000);
        }

        function renderHomeScreen() {
            const grid1 = document.getElementById('app-grid-1');
            grid1.innerHTML = '';
            defaultApps.slice(0, 8).forEach(app => {
                const el = document.createElement('div');
                el.className = `app-icon flex flex-col items-center`;
                el.innerHTML = `
                    <div class="w-16 h-16 rounded-2xl flex items-center justify-center text-4xl shadow-lg" style="background: ${app.color}">${app.emoji}</div>
                    <div class="text-white text-xs mt-2">${app.name}</div>
                `;
                el.onclick = app.open;
                grid1.appendChild(el);
            });
        }

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true}).replace(' AM','').replace(' PM','');
            document.getElementById('status-time').textContent = time;
            document.getElementById('lock-time').textContent = time;
        }

        function unlockPhone() {
            document.getElementById('lock-screen').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
            }, 600);
        }

        function showFaceID() {
            alert("🔓 Face ID Unlocked");
            unlockPhone();
        }

        // Camera
        async function openCamera() {
            closeCurrentApp();
            document.getElementById('camera-app').classList.remove('hidden');
            currentApp = 'camera';
            const video = document.getElementById('camera-feed');
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode } });
                video.srcObject = cameraStream;
            } catch(e) { alert("Camera permission denied"); }
        }

        function switchCamera() {
            facingMode = facingMode === "user" ? "environment" : "user";
            if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
            openCamera();
        }

        function takePhoto() {
            const video = document.getElementById('camera-feed');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            canvas.getContext('2d').drawImage(video, 0, 0);
            photos.unshift(canvas.toDataURL('image/jpeg'));
            alert("📸 Photo saved to Photos app!");
        }

        function openPhotos() {
            closeCurrentApp();
            let html = `<div class="p-4 text-white">Photos Gallery<br><br>`;
            photos.forEach(src => {
                html += `<img src="${src}" class="w-full rounded-2xl mb-4">`;
            });
            html += `</div>`;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            tempDiv.onclick = closeCurrentApp;
            document.getElementById('iphone-screen').appendChild(tempDiv);
            currentApp = 'photos';
        }

        function openMessages() {
            closeCurrentApp();
            document.getElementById('messages-app').classList.remove('hidden');
            currentApp = 'messages';
        }

        function openMusic() {
            closeCurrentApp();
            document.getElementById('music-app').classList.remove('hidden');
            currentApp = 'music';
        }

        function openSafari() {
            closeCurrentApp();
            const url = prompt("Enter website (demo):", "https://x.ai");
            if (url) window.open(url, '_blank');
        }

        function openSettings() {
            alert("⚙️ Settings opened\n\nLock Screen • Display • Camera • etc.");
        }

        function togglePlay() {
            const btn = document.getElementById('play-btn');
            btn.classList.toggle('fa-pause-circle');
            btn.classList.toggle('fa-play-circle');
        }

        function closeCurrentApp() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            document.querySelectorAll('#iphone-screen > div[id$="-app"]').forEach(el => el.classList.add('hidden'));
            currentApp = null;
        }

        // Global functions
        window.unlockPhone = unlockPhone;
        window.showFaceID = showFaceID;
        window.openCamera = openCamera;
        window.switchCamera = switchCamera;
        window.takePhoto = takePhoto;
        window.openPhotos = openPhotos;
        window.openMessages = openMessages;
        window.openMusic = openMusic;
        window.openSafari = openSafari;
        window.closeCurrentApp = closeCurrentApp;
        window.togglePlay = togglePlay;

        window.onload = init;
    </script>
</body>
</html>
